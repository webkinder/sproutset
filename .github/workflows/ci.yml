name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint (Rector + Pint, check only)
        run: composer lint:check

      - name: Static analysis (PHPStan)
        run: composer types:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4', '8.5']
    name: test (php ${{ matrix.php }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Test (Pest)
        run: composer test

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        wp: ['6.7', 'latest']
    name: integration (wp ${{ matrix.wp }})
    services:
      mysql:
        image: mysql:26.7@sha256:66aec17cd21a956029b83f083b813073859e8355dc1a00e55df6ba02f0e32345
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: mysqli, gd
          coverage: none
          tools: wp-cli

      - name: Install drift-lane dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: tests/Integration

      - name: Download WordPress core (${{ matrix.wp }})
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            wp core download --path=/tmp/wordpress --skip-content
          else
            wp core download --version=${{ matrix.wp }} --path=/tmp/wordpress --skip-content
          fi

      # The bundled WordPress test suite (wp-phpunit) is versioned per WordPress
      # release; align it with the core under test so the suite matches its APIs.
      - name: Align the WordPress test suite to the series
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            CONSTRAINT="^7.0"
          else
            CONSTRAINT="${{ matrix.wp }}.*"
          fi
          composer require --working-dir=tests/Integration --dev --with-all-dependencies --no-interaction "wp-phpunit/wp-phpunit:${CONSTRAINT}"

      - name: Run the drift lane
        env:
          WP_TESTS_ABSPATH: /tmp/wordpress
          WP_TESTS_CONTENT_DIR: /tmp/wp-content
          WP_TESTS_DB_NAME: wordpress_test
          WP_TESTS_DB_USER: root
          WP_TESTS_DB_PASSWORD: root
          WP_TESTS_DB_HOST: 127.0.0.1
        run: composer test:integration
